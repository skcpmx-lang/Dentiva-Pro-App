[workspace]
members = ["crates/dentiva-core"]
default-members = ["crates/dentiva-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Shohan Khan <helloiamshohan@gmail.com>"]
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
