name: Native foundation checks
on:
  push:
    branches: [arena/01a0e166-dentiva-pro-app]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Resolve initial lockfile when absent
        shell: bash
        run: |
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
      - name: Check formatting
        id: format
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Compile and lint native core
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and database integration tests
        run: cargo test --locked --all-targets
      - name: Capture bootstrap lockfile and formatter patch
        if: always()
        shell: bash
        run: |
          mkdir -p ci-evidence
          if [ -f Cargo.lock ]; then cp Cargo.lock ci-evidence/; fi
          cargo fmt --all
          git diff -- crates > ci-evidence/rustfmt.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-evidence-${{ matrix.os }}
          path: ci-evidence/
      - name: Enforce formatter result
        if: steps.format.outcome == 'failure'
        run: exit 1
