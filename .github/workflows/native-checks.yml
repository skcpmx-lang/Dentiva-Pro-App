name: Native foundation checks
on:
  push:
    branches: [arena/01a0e166-dentiva-pro-app]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Validate locked dependency resolution
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Production migration constraints
        run: python -m unittest discover -s tests/integration -v
      - name: Release-gate validator tests
        run: python -m unittest discover -s tests/unit -v
      - name: Check formatting
        id: format
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Compile and lint native core
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and database integration tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --all-targets 2>&1 | tee native-tests.log
      - name: Publish native test transcript through Checks API
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: python scripts/publish_ci_evidence.py
      - name: Capture bootstrap lockfile and formatter patch
        if: always()
        shell: bash
        run: |
          mkdir -p ci-evidence
          if [ -f Cargo.lock ]; then cp Cargo.lock ci-evidence/; fi
          if [ -f native-tests.log ]; then cp native-tests.log ci-evidence/; fi
          cargo fmt --all
          git diff -- crates > ci-evidence/rustfmt.patch
      - name: Publish formatter patch through Checks API
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.format.outcome }}
          EVIDENCE_FILE: ci-evidence/rustfmt.patch
          EVIDENCE_NAME: Formatter evidence
        run: python scripts/publish_ci_evidence.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: native-evidence-${{ matrix.os }}
          path: ci-evidence/
      - name: Enforce formatter result
        if: always() && steps.format.outcome != 'success'
        run: exit 1
